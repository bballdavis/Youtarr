services:
  db:
    image: mariadb:10.3
    environment:
      MYSQL_ROOT_PASSWORD: external-api-rc-root
      MYSQL_DATABASE: youtarr_rc
      MYSQL_USER: youtarr_rc
      MYSQL_PASSWORD: external-api-rc
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --innodb-file-per-table=1
    volumes:
      - external-api-rc-db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "youtarr_rc", "-pexternal-api-rc"]
      interval: 2s
      timeout: 3s
      retries: 30

  youtarr:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: youtarr_rc
      DB_USER: youtarr_rc
      DB_PASSWORD: external-api-rc
      AUTH_ENABLED: "true"
      AUTH_PRESET_USERNAME: external-api-rc-admin
      AUTH_PRESET_PASSWORD: external-api-rc-password
      EXTERNAL_API_ENABLED: "${EXTERNAL_API_ENABLED:-true}"
      TRUST_PROXY: "false"
      YOUTUBE_OUTPUT_DIR: /usr/src/app/data
      LOG_LEVEL: info
    ports:
      - "${EXTERNAL_API_RC_PORT:-3187}:3011"
    volumes:
      - external-api-rc-config:/app/config
      - external-api-rc-jobs:/app/jobs
      - external-api-rc-images:/app/server/images
      - external-api-rc-downloads:/usr/src/app/data
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--output", "/dev/null", "http://localhost:3011/api/health"]
      interval: 3s
      timeout: 3s
      retries: 30

volumes:
  external-api-rc-db:
  external-api-rc-config:
  external-api-rc-jobs:
  external-api-rc-images:
  external-api-rc-downloads:
